<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CET-6 单词训练器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#3730a3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CET6">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div>
        <h1>CET-6 单词训练器</h1>
        <p class="subtitle">本地网页训练 · 错题次数保存到 JSON 文件</p>
      </div>
      <div id="stats" class="stats-pill">加载中...</div>
    </header>

    <main id="app" class="app-card">
      <div class="loading">正在加载单词表和本地数据...</div>
    </main>
  </div>

  <script src="./words.js"></script>
  <script src="./articles.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
